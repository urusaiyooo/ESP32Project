[platformio]
default_envs = esp32s3_n16r8
# Keep linker outputs outside Unicode project paths on Windows GCC 8.
build_dir = ${sysenv.TEMP}/DeskHub-S3-GitHub-build

[env]
platform = platformio/espressif32@7.0.0
framework = arduino
extra_scripts = pre:../tools/platformio_paths.py
board_build.partitions = huge_app.csv
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212
monitor_speed = 460800
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    bblanchon/ArduinoJson@7.4.2

[env:esp32s3_n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_build.partitions = partitions_video.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
